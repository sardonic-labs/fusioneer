name: fusioneer
on:
  issues:
    types: [labeled, opened]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  trigger:
    if: contains(github.event.label.name, 'fusioneer:auto') || contains(github.event.comment.body, '/fusioneer') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fusioneer webhook
        env:
          FUSIONEER_DOMAIN: ${{ secrets.FUSIONEER_DOMAIN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$FUSIONEER_DOMAIN" ]; then echo "FUSIONEER_DOMAIN not set — skipping"; exit 0; fi
          payload=$(jq -n --arg repo "${{ github.repository }}" --arg event "${{ github.event_name }}" --argjson payload '${{ toJson(github.event) }}' '{repo:$repo,event:$event,payload:$payload}')
          # HMAC via webhook secret if available; VPS verifies X-Hub-Signature-256
          curl -fsSL -X POST "$FUSIONEER_DOMAIN/webhook/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: $event" \
            -H "X-GitHub-Delivery: ${{ github.event.repository.id }}-${{ github.run_id }}" \
            -d "$payload" || echo "webhook failed"
